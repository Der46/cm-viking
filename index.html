        <nav class="quest-tabs" id="quest-tabs"></nav>
        <div class="title-block">

          <p class="seal" aria-label="大佬群CSL製作"><span aria-hidden="true">大佬群</span><strong aria-hidden="true">CSL</strong><span aria-hidden="true">製作</span></p>

        <p class="tagline" data-i18n="tagline"></p>

        <fieldset class="tiers">
          <legend data-i18n="tier">選擇主獎</legend>
          <div class="tier-list" id="tier-list"></div>

        <p class="tier-note" id="tier-note"></p>
      </div>

          <h2 data-i18n="pathTitle">關卡地圖</h2>

    <section class="overview wrap" aria-labelledby="table-title">
      <div class="overview-head">
        <h2 id="table-title" data-i18n="tableTitle"></h2>
        <p class="total" id="total"></p>
